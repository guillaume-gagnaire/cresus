services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matreso
      POSTGRES_PASSWORD: matreso
      POSTGRES_DB: matreso
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matreso"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    image: ma-treso
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://matreso:matreso@db:5432/matreso
      # obligatoire, sans valeur par défaut : une valeur connue de tous permettrait de forger les cookies de session (ex. SESSION_SECRET=$(openssl rand -hex 32) docker compose up)
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requis}
      # origine publique du site, sans chemin ni « / » final : émetteur OAuth, ressource MCP (PUBLIC_URL + /mcp) et consentement
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # passkeys : vides, ils sont déduits de PUBLIC_URL (domaine et origine) ; ne les renseigner que pour un cas particulier
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # false pour l'essai local en http (un cookie Secure n'y serait pas renvoyé) ; à passer à true derrière HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      # entier ≥ 1 (jamais vide : le « :- » reprend la valeur par défaut si la variable est vide)
      OAUTH_RATE_LIMIT_MULTIPLIER: ${OAUTH_RATE_LIMIT_MULTIPLIER:-1}
      TZ: Europe/Paris
    ports:
      - "${APP_PORT:-3000}:3000"
volumes:
  db-data: {}
