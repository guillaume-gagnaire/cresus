services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matreso
      POSTGRES_PASSWORD: matreso
      POSTGRES_DB: matreso
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matreso"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data: {}
